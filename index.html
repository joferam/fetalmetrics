  const toUTCDate = (str) => { if(!str) return null; const [y,m,d]=str.split('-'); return new Date(Date.UTC(y,m-1,d)); };
  const formatDate = (d) => d ? d.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'}) : '';

  let toastContainer = null;
  const getToastContainer = () => {
    if (!toastContainer) { toastContainer = document.createElement('div'); toastContainer.className = 'toast-container'; document.body.appendChild(toastContainer); }
    return toastContainer;
  };
  const showToast = (message, type='error', duration=3500) => {
    const container = getToastContainer();
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<span class="toast-icon">⚠️</span><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.classList.add('toast-fade-out'); setTimeout(() => { if(toast.parentNode) toast.parentNode.removeChild(toast); }, 300); }, duration);
  };

  // ==================== PERCENTIL OMS (Kiserud 2017) ====================
  const EFW_COEF = {
    0.01:[-5.01496264869835e-2,3.74471599175392e-1,-5.34930256943893e-3,2.3744363684445e-5],
    0.025:[-2.30518383014592e-1,4.00511116318458e-1,-6.17993235833267e-3,3.16595762972649e-5],
    0.05:[-1.62057103557898e-1,3.93965369913166e-1,-5.79733056422172e-3,2.55319128239087e-5],
    0.10:[-4.55887642525626e-2,3.89314052082164e-1,-5.74527674062641e-3,2.65557891064333e-5],
    0.25:[-1.2258767992062e-2,3.93836404898322e-1,-5.92304885519551e-3,2.8863017896588e-5],
    0.50:[1.57310086966445e-1,3.83067935520509e-1,-5.54046846639963e-3,2.46570062800598e-5],
    0.75:[2.93297386426919e-1,3.76096229210412e-1,-5.29255036113726e-3,2.18372277641981e-5],
    0.90:[3.53142227490073e-1,3.76486874470206e-1,-5.28742945785833e-3,2.14760212556463e-5],
    0.95:[2.85025055968914e-1,3.90621472299378e-1,-5.82929182402995e-3,2.79088693116937e-5],
    0.975:[4.08170594889372e-1,3.81068214664342e-1,-5.50913922743603e-3,2.46713147783532e-5],
    0.99:[7.9584342596075e-1,3.42142215761221e-1,-4.14863204456851e-3,1.02097735855226e-5]
  };
  const QUANTILES = [0.01,0.025,0.05,0.10,0.25,0.50,0.75,0.90,0.95,0.975,0.99];
  const evalEFW = (coef,ga) => coef[0]+coef[1]*ga+coef[2]*ga*ga+coef[3]*ga*ga*ga;
  const percentilOMS = (peso,semanas) => {
    if(semanas<14||semanas>40) return null;
    const lnP = Math.log(peso);
    const vals = QUANTILES.map(q=>({q,v:evalEFW(EFW_COEF[q],semanas)}));
    if(lnP<=vals[0].v) return 0.5;
    if(lnP>=vals[vals.length-1].v) return 99.5;
    for(let i=0;i<vals.length-1;i++){
      if(lnP>=vals[i].v&&lnP<=vals[i+1].v){
        const t=(lnP-vals[i].v)/(vals[i+1].v-vals[i].v);
        return Math.round((vals[i].q+t*(vals[i+1].q-vals[i].q))*1000)/10;
      }
    }
    return null;
  };
  const hadlock4 = (bpd,hc,ac,fl) => {
    if(!bpd||!hc||!ac||!fl) return null;
    const B=bpd/10,H=hc/10,A=ac/10,F=fl/10;
    return Math.round(Math.pow(10, 1.3596-0.00386*A*F+0.0064*H+0.00061*B*A+0.0424*A+0.174*F));
  };

  // ==================== CRECIMIENTO FETAL ====================

  // ==================== DOPPLER: VISTA DETALLE (UtA / UA / MCA / DV) ====================
  

  // ==================== LCN / CRL (Robinson & Fleming 1975, FMF) ====================
  // Fórmula bidireccional:
  // LCN→EG: GA(días) = 8.052 × √(LCN_mm × 1.037) + 23.73
  // EG→LCN: LCN_mm = ((GA_días - 23.73) / 8.052)² / 1.037

  const crlToGA = (crl_mm) => {
    const days = 8.052 * Math.sqrt(crl_mm * 1.037) + 23.73;
    const weeks = Math.floor(days / 7);
    const d = Math.round(days % 7);
    return { days: Math.round(days), weeks, d };
  };

  const gaToCRL = (ga_days) => {
    const inside = (ga_days - 23.73) / 8.052;
    return Math.round((inside * inside) / 1.037);
  };

  // Tabla LCN p5/p50/p95 por semana (6 a 14)
  // Derivada de Robinson & Fleming + Snijders & Nicolaides 1994
  const CRL_TABLE = {
    6:  {p5:3,  p50:5,  p95:9},
    7:  {p5:6,  p50:10, p95:15},
    8:  {p5:10, p50:16, p95:22},
    9:  {p5:15, p50:23, p95:31},
    10: {p5:21, p50:31, p95:41},
    11: {p5:28, p50:41, p95:53},
    12: {p5:36, p50:52, p95:66},
    13: {p5:46, p50:63, p95:80},
    14: {p5:56, p50:75, p95:94},
  };

  const calcCRLPerc = (crl_mm, ga_weeks) => {
    const w = Math.max(6, Math.min(14, Math.round(ga_weeks)));
    const ref = CRL_TABLE[w];
    if(!ref) return null;
    // Interpolación entre p5/p50/p95 usando distribución log-normal
    if(crl_mm <= ref.p5) return Math.max(0.5, (crl_mm / ref.p5) * 5);
    if(crl_mm >= ref.p95) return Math.min(99.5, 95 + ((crl_mm - ref.p95) / ref.p95) * 5);
    if(crl_mm <= ref.p50) {
      const t = (crl_mm - ref.p5) / (ref.p50 - ref.p5);
      return Math.round((5 + t * 45) * 10) / 10;
    }
    const t = (crl_mm - ref.p50) / (ref.p95 - ref.p50);
    return Math.round((50 + t * 45) * 10) / 10;
  };

  // ── Gráfico LCN ──
  const CRLChart = ({crl_mm, ga_weeks, pct}) => {
    const W = 320, H = 160;
    const PAD = {l:32, r:16, t:14, b:24};
    const chartW = W - PAD.l - PAD.r;
    const chartH = H - PAD.t - PAD.b;
    const semMin = 6, semMax = 14;
    const sems = [6,7,8,9,10,11,12,13,14];

    const allMm = sems.flatMap(s => [CRL_TABLE[s].p5, CRL_TABLE[s].p95]);
    const mmMin = 0;
    const mmMax = Math.max(...allMm) * 1.08;

    const xScale = s => PAD.l + (s - semMin) / (semMax - semMin) * chartW;
    const yScale = v => PAD.t + chartH - (v - mmMin) / (mmMax - mmMin) * chartH;
    const pathFrom = pts => 'M' + pts.map(p => `${xScale(p.w).toFixed(1)},${yScale(p.v).toFixed(1)}`).join(' L');

    const p5pts  = sems.map(s => ({w:s, v:CRL_TABLE[s].p5}));
    const p50pts = sems.map(s => ({w:s, v:CRL_TABLE[s].p50}));
    const p95pts = sems.map(s => ({w:s, v:CRL_TABLE[s].p95}));

    const ga_w = ga_weeks || 10;
    const px = xScale(Math.max(semMin, Math.min(semMax, ga_w)));
    const py = yScale(Math.max(0, Math.min(mmMax, crl_mm)));

    const colorP = pct < 5 || pct > 95 ? '#c0392b' : pct < 10 || pct > 90 ? '#d9822b' : '#1AA3B7';

    return e('div',{style:{marginTop:14,background:'#f7fafc',borderRadius:16,padding:'10px 8px 6px'}},
      e('div',{style:{fontSize:11,color:'#3b6f8a',marginBottom:4}},
        'LCN ',crl_mm,' mm · EG estimada: ',crlToGA(crl_mm).weeks,'+',crlToGA(crl_mm).d,' sem',
        pct !== null ? e('span',{style:{marginLeft:8,fontWeight:700,color:colorP}},pct.toFixed(1),'%') : null
      ),
      e('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:'auto',overflow:'visible'}},
        // Grid
        [0,25,50,75].map((v,i) =>
          e('line',{key:'g'+i,x1:PAD.l,y1:yScale(v),x2:W-PAD.r,y2:yScale(v),stroke:'#dce7ed',strokeWidth:1})
        ),

  // ── Widget LCN ──
  const CRLWidget = ({t}) => {
    const [mode, setMode] = useState('crl2ga'); // crl2ga | ga2crl
    const [crl, setCrl] = useState('');
    const [weeks, setWeeks] = useState('');
    const [days, setDays] = useState('');
    const [res, setRes] = useState(null);
    const [fur, setFur] = useState('');
    const [showRef, setShowRef] = useState(false);
    const [errCrl, setErrCrl] = useState('');
    const [errWeeks, setErrWeeks] = useState('');

    const calcFromCRL = () => {
      setErrCrl(''); setErrWeeks('');
      const mm = parseFloat(crl);
      if(isNaN(mm) || mm < 3 || mm > 100) { setErrCrl(t('crl_err_range')); return; }
      const ga = crlToGA(mm);
      const pct = calcCRLPerc(mm, ga.weeks + ga.d/7);
      // Comparación con FUR si fue ingresada
      let furComp = null;
      if(fur) {
        const [y,m,d] = fur.split('-');
        const lmp = new Date(Date.UTC(y, m-1, d));
        const today = new Date(); today.setUTCHours(0,0,0,0);
        const diffDays = Math.floor((today - lmp) / 86400000);
        if(diffDays > 0) {
          const furWeeks = Math.floor(diffDays/7);
          const furDays = diffDays % 7;
          const diffWithCRL = ga.days - diffDays;
          furComp = { weeks: furWeeks, days: furDays, diffDays: diffWithCRL };
        }
      }
      setRes({ type:'crl2ga', mm, ga, pct, furComp });
    };

    const calcFromGA = () => {
      setErrCrl(''); setErrWeeks('');
      const w = parseInt(weeks);
      if(isNaN(w) || w < 6 || w > 14) { setErrWeeks(t('crl_err_ga_range')); return; }
      const d = parseInt(days) || 0;
      const ga_days = w * 7 + d;
      const mm = gaToCRL(ga_days);
      setRes({ type:'ga2crl', mm, ga:{weeks:w, d, days:ga_days}, pct:null });
    };

            e('input',{type:'date',value:fur,style:{marginBottom:16},onChange:ev=>{setFur(ev.target.value);setRes(null);}}),
            e('button',{className:'btn',onClick:calcFromCRL},t('crl_calc_btn'))

              )
            ),
            e(FieldError,{msg:errWeeks}),
            e('button',{className:'btn',onClick:calcFromGA},t('crl_calc_ga_btn'))

      res && e('div',null,
        e('div',{className:'result-box',style:{marginTop:16}},

            ? e('div',null,
                e('div',{className:'result-big'},res.ga.weeks,'+',res.ga.d),
                e('div',{style:{fontSize:12,marginBottom:4}},t('ga_weeks')),
                e('hr'),
                e('div',{style:{fontSize:14,fontWeight:600}},t('crl_result_mm'),': ',res.mm,' mm'),
                res.pct !== null && e('div',{style:{marginTop:6,fontSize:13,color:'#3b6f8a'}},t('crl_result_perc'),': ',
                  e('span',{style:{fontWeight:800,color:res.pct<5||res.pct>95?'#c0392b':res.pct<10||res.pct>90?'#d9822b':'#1f9d55'}},res.pct.toFixed(1),'%')
                ),
                e('div',{className:'result-note'},t('crl_note')),
                res.furComp && e('div',{style:{marginTop:12,padding:'10px 14px',background:'white',borderRadius:14,border:'1px solid #dce7ed'}},
                  e('div',{style:{fontSize:11,fontWeight:700,color:'#3b6f8a',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},t('crl_fur_compare')),
                  e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},

                  ),

                    e('span',{style:{fontSize:12,color:'#4a627a'}},t('crl_diff_label')),
                    e('span',{style:{
                      fontSize:13,fontWeight:800,
                      color: Math.abs(res.furComp.diffDays) <= 5 ? '#1f9d55' : Math.abs(res.furComp.diffDays) <= 7 ? '#d9822b' : '#c0392b'
                    }},
                      (res.furComp.diffDays > 0 ? '+' : ''),res.furComp.diffDays,' días · ',
                      Math.abs(res.furComp.diffDays) <= 5 ? t('crl_concordant') :
                      Math.abs(res.furComp.diffDays) <= 7 ? t('crl_borderline') : t('crl_discordant')
                    )
                  )
                )
              )
            : e('div',null,
                e('div',{className:'result-big'},res.mm,' mm'),
                e('div',{style:{fontSize:12,marginBottom:4}},t('crl_result_expected')),
                e('hr'),
                e('div',{style:{fontSize:14,fontWeight:600}},'EG: ',res.ga.weeks,'+',res.ga.d,' sem'),
                e('div',{className:'result-note'},t('crl_note')),
                res.furComp && e('div',{style:{marginTop:12,padding:'10px 14px',background:'white',borderRadius:14,border:'1px solid #dce7ed'}},
                  e('div',{style:{fontSize:11,fontWeight:700,color:'#3b6f8a',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},t('crl_fur_compare')),
                  e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},

                  ),
                  e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
                    e('span',{style:{fontSize:13,color:'#4a627a'}},t('crl_lcn_label')),
                    e('span',{style:{fontSize:13,fontWeight:700,color:'#0f3b4f'}},res.ga.weeks,'+',res.ga.d,' sem')
                  ),

                    e('span',{style:{fontSize:12,color:'#4a627a'}},t('crl_diff_label')),
                    e('span',{style:{
                      fontSize:13,fontWeight:800,
                      color: Math.abs(res.furComp.diffDays) <= 5 ? '#1f9d55' : Math.abs(res.furComp.diffDays) <= 7 ? '#d9822b' : '#c0392b'
                    }},
                      (res.furComp.diffDays > 0 ? '+' : ''),res.furComp.diffDays,' días · ',
                      Math.abs(res.furComp.diffDays) <= 5 ? t('crl_concordant') :
                      Math.abs(res.furComp.diffDays) <= 7 ? t('crl_borderline') : t('crl_discordant')
                    )
                  )
                )
              )
        ),
        e(CRLChart,{crl_mm:res.mm, ga_weeks:gaDecimal, pct:res.pct})
      ),
      showRef && e(RefModal,{title:t('crl_ref_title'),text:t('crl_ref_text'),onClose:()=>setShowRef(false),closeLabel:t('close')})
    );
  };

  // ==================== BIOMETRÍA FETAL OMS (Kiserud 2017) ====================
  const BIOM_COEF = {
    BPD:{
      0.01:[5.91008401542612e-1,2.51833515513537e-1,-5.82602136865785e-3,4.85842528593502e-5,0],
      0.025:[5.8340478243682e-1,2.57706867351367e-1,-6.08380366281251e-3,5.16940376186165e-5,0],

      0.25:[7.69315103415485e-1,2.49927024175735e-1,-5.92399444708251e-3,5.076548429269e-5,0],

      0.90:[1.01351909208103,2.37088857953509e-1,-5.5421492813894e-3,4.65258350076297e-5,0],
      0.95:[1.11401192681678,2.28258457814188e-1,-5.24271052970102e-3,4.31665697359201e-5,0],
      0.975:[1.17917438634649,2.24245686901115e-1,-5.13638678692311e-3,4.21401138788865e-5,0],
      0.99:[1.18876528083144,2.2624188722951e-1,-5.22504825833189e-3,4.31577122241698e-5,0]
    },
    HC:{
      0.01:[1.51782795874402,2.99296859125438e-1,-7.52376152126206e-3,6.7179373384666e-5,0],
      0.025:[1.59317517131532,2.9459800552433e-1,-7.3860372566707e-3,6.56951770216148e-5,0],
      0.05:[1.74883945698398,2.78405280785763e-1,-6.77990950687641e-3,5.83587774721548e-5,0],
      0.10:[1.83059537388222,2.7244251174974e-1,-6.59546864496838e-3,5.63957469365128e-5,0],
      0.25:[1.94181945227701,2.6584757167445e-1,-6.44544904011178e-3,5.54517813431795e-5,0],
      0.50:[2.09924879247164,2.53373656106037e-1,-6.05647816678282e-3,5.14256072059917e-5,0],
      0.75:[2.20777451923048,2.45212320927953e-1,-5.78557948587613e-3,4.83972618799514e-5,0],
      0.90:[2.31776999721364,2.36651510200538e-1,-5.50781288608926e-3,4.53975879344267e-5,0],
      0.95:[2.39550106176494,2.29586666082063e-1,-5.25318141633775e-3,4.23738937924844e-5,0],
      0.975:[2.50074069629423,2.20067854715719e-1,-4.93623111462443e-3,3.89066000946519e-5,0],
      0.99:[2.50189533265806,2.23785148311865e-1,-5.14245402239348e-3,4.20117020605557e-5,0]
    },
    AC:{
      0.01:[1.19682766661905,3.09985569982485e-1,-7.79821008212983e-3,7.21601862187339e-5,0],
      0.025:[1.19202778944614,3.14756681991964e-1,-8.01581308902169e-3,7.51395976546808e-5,0],
      0.05:[1.09869954558741,3.30079995799838e-1,-8.62095843727276e-3,8.25440120054722e-5,0],
      0.10:[1.24418122481299,3.16315401650234e-1,-8.14092689297361e-3,7.72501495178619e-5,0],
      0.25:[1.44520878528145,2.99433786203949e-1,-7.59672485585945e-3,7.1668993412344e-5,0],
      0.50:[1.58552931028045,2.89936781915424e-1,-7.32651929135797e-3,6.9261631643994e-5,0],
      0.75:[1.71452506914277,2.81367067786763e-1,-7.08195596502471e-3,6.7086230433841e-5,0],
      0.90:[1.78078382317074,2.79278890414784e-1,-7.0643788983289e-3,6.75104548969352e-5,0],
      0.95:[1.83213806223649,2.77106952998102e-1,-7.03388540291938e-3,6.76124200964958e-5,0],
      0.975:[2.03674472691951,2.57138461817474e-1,-6.34918788914223e-3,6.0053745113196e-5,0],
      0.99:[2.12378932803127,2.48505815693966e-1,-6.01677942684253e-3,5.62286023490798e-5,0]
    },
    FL:{
      0.01:[-7.63357391915398,1.32616480908407,-6.03406386286656e-2,1.27059302964739e-3,-1.01590910980777e-5],
      0.025:[-7.27187176976836,1.28298928826162,-5.80601892487905e-2,1.21314319801879e-3,-9.60171505470123e-6],
      0.05:[-7.07052933404414,1.26780052700097,-5.77556347769781e-2,1.21608381996396e-3,-9.70361787292646e-6],
      0.10:[-6.69175407354157,1.22500911064189,-5.5920618206786e-2,1.18320191905997e-3,-9.50365006831978e-6],
      0.25:[-6.07953118554742,1.15245170563351,-5.25510654314434e-2,1.11418613323875e-3,-8.9802280974713e-6],
      0.50:[-5.54922620776446,1.09559990166124,-5.01310925949098e-2,1.0678072569586e-3,-8.63970606288493e-6],
      0.75:[-4.68666987282664,9.78111793398168e-1,-4.39319069083821e-2,9.2346644003072e-4,-7.39427758542544e-6],
      0.90:[-4.31219596825529,9.4038705308254e-1,-4.24709867520927e-2,8.9977742409265e-4,-7.26284658350453e-6],
      0.95:[-4.12398207550525,9.20344210800571e-1,-4.15728969581384e-2,8.81055511995407e-4,-7.10843959625547e-6],
      0.975:[-3.64483930811801,8.57028131514986e-1,-3.84005685481303e-2,8.12062784461527e-4,-6.55932416998498e-6],
      0.99:[-3.40004123807778,8.34596760116344e-1,-3.76568882663223e-2,8.03601513837836e-4,-6.55323852770109e-6]
    }
  };
  const BIOM_QQ=[0.01,0.025,0.05,0.10,0.25,0.50,0.75,0.90,0.95,0.975,0.99];
  const evalBiomPoly=(c,g)=>c[0]+c[1]*g+c[2]*g*g+c[3]*g*g*g+c[4]*g*g*g*g;
  const calcBiomPerc=(mm,ga,dim)=>{
    if(!mm||mm<=0||ga<14||ga>40) return null;
    const lnM=Math.log(mm), coefDim=BIOM_COEF[dim];
    const vals=BIOM_QQ.map(q=>({q,v:evalBiomPoly(coefDim[q],ga)}));
    if(lnM<=vals[0].v) return 0.5;
    if(lnM>=vals[vals.length-1].v) return 99.5;
    for(let i=0;i<vals.length-1;i++){
      if(lnM>=vals[i].v&&lnM<=vals[i+1].v){
        const t=(lnM-vals[i].v)/(vals[i+1].v-vals[i].v);
        return Math.round((vals[i].q+t*(vals[i+1].q-vals[i].q))*1000)/10;
      }
    }
    return null;
  };


  // ── Generador de curvas para gráficos ──
  const buildBiomCurve = (dim, quantile) => {
    const weeks = [];
    for(let w=14; w<=42; w++) weeks.push(w);
    return weeks.map(w => ({
      w,
      mm: Math.round(Math.exp(evalBiomPoly(BIOM_COEF[dim][quantile], w))*10)/10
    }));
  };

  const BiomChart = ({dim, mm, ga, pct}) => {
    const p5  = buildBiomCurve(dim, 0.05);
    const p50 = buildBiomCurve(dim, 0.50);
    const p95 = buildBiomCurve(dim, 0.95);

    const W = 320, H = 160;
    const PAD = {l:32, r:12, t:14, b:24};
    const chartW = W - PAD.l - PAD.r;
    const chartH = H - PAD.t - PAD.b;
    const semMin = 14, semMax = 42;

    const allMm = [...p5.map(d=>d.mm), ...p95.map(d=>d.mm)];
    const mmMin = Math.min(...allMm) * 0.95;
    const mmMax = Math.max(...allMm) * 1.05;

    const xScale = s => PAD.l + (s - semMin) / (semMax - semMin) * chartW;
    const yScale = v => PAD.t + chartH - (v - mmMin) / (mmMax - mmMin) * chartH;

    const pathFrom = pts => 'M' + pts.map(d => `${xScale(d.w).toFixed(1)},${yScale(d.mm).toFixed(1)}`).join(' L');

    // Punto del paciente
    const px = xScale(ga);
    const py = yScale(mm);

    // Labels eje X
    const xTicks = [16, 20, 24, 28, 32, 36, 40];
    // Labels eje Y (3 valores)
    const yTicks = [
      { v: mmMin + (mmMax-mmMin)*0.1, label: Math.round(mmMin + (mmMax-mmMin)*0.1) },
      { v: mmMin + (mmMax-mmMin)*0.5, label: Math.round(mmMin + (mmMax-mmMin)*0.5) },
      { v: mmMin + (mmMax-mmMin)*0.9, label: Math.round(mmMin + (mmMax-mmMin)*0.9) },
    ];

    const p = pct !== null && pct !== undefined ? pct : 50;
    const colorP = p < 3 || p > 97 ? '#c0392b' : p < 10 || p > 90 ? '#d9822b' : '#1AA3B7';

    return e('div',{style:{marginTop:12,background:'#f7fafc',borderRadius:16,padding:'10px 8px 6px'}},
      e('div',{style:{fontSize:11,fontWeight:700,color:'#3b6f8a',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.4px'}},
        dim,' — ',mm,' mm · ',e('span',{style:{color:colorP}},pct.toFixed(1),'%')
      ),
      e('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:'auto',overflow:'visible'}},
        // Grid lines horizontales sutiles
        yTicks.map((t,i) =>
          e('line',{key:'gy'+i, x1:PAD.l, y1:yScale(t.v), x2:W-PAD.r, y2:yScale(t.v),
            stroke:'#dce7ed', strokeWidth:1})
        ),
        // Curvas percentiles
        e('path',{d:pathFrom(p5), fill:'none', stroke:'#f0a0a0', strokeWidth:1.5, strokeDasharray:'4,3'}),
        e('path',{d:pathFrom(p50), fill:'none', stroke:'#1AA3B7', strokeWidth:2}),
        e('path',{d:pathFrom(p95), fill:'none', stroke:'#f0a0a0', strokeWidth:1.5, strokeDasharray:'4,3'}),
        // Labels curvas
        e('text',{x:W-PAD.r+2, y:yScale(p5[p5.length-1].mm)+4, fontSize:8, fill:'#f0a0a0'},'p5'),
        e('text',{x:W-PAD.r+2, y:yScale(p50[p50.length-1].mm)+4, fontSize:8, fill:'#1AA3B7'},'p50'),
        e('text',{x:W-PAD.r+2, y:yScale(p95[p95.length-1].mm)+4, fontSize:8, fill:'#f0a0a0'},'p95'),
        // Punto paciente
        e('circle',{cx:px, cy:py, r:6, fill:colorP, stroke:'white', strokeWidth:2}),
        // Label del punto
        e('text',{x:px+(px>W*0.7?-8:8), y:py-8, fontSize:9, fontWeight:'bold', fill:colorP,
          textAnchor:px>W*0.7?'end':'start'},
          pct.toFixed(1),'%'
        ),
        // Eje X ticks
        xTicks.map((s,i) =>
          e('text',{key:'xt'+i, x:xScale(s), y:H-4, fontSize:8, fill:'#8aaec0', textAnchor:'middle'},s)
        ),
        // Eje Y ticks
        yTicks.map((t,i) =>
          e('text',{key:'yt'+i, x:PAD.l-3, y:yScale(t.v)+3, fontSize:8, fill:'#8aaec0', textAnchor:'end'},t.label)
        ),
        // Label eje X
        e('text',{x:PAD.l+chartW/2, y:H+2, fontSize:8, fill:'#8aaec0', textAnchor:'middle'},'semanas')
      )
    );
  };

  const BiometryWidget = ({t}) => {
    const [weeks,setWeeks]=useState('');
    const [days,setDays]=useState('');
    const [bpd,setBpd]=useState('');
    const [hc,setHc]=useState('');
    const [ac,setAc]=useState('');
    const [fl,setFl]=useState('');
    const [res,setRes]=useState(null);
    const [showRef,setShowRef]=useState(false);
    const [errWeeks,setErrWeeks]=useState('');
    const [errDays,setErrDays]=useState('');
    const [errBio,setErrBio]=useState('');

    const toDecimal=(w,d)=>{const wN=parseInt(w),dN=parseInt(d)||0;if(isNaN(wN)||wN<14||wN>40)return null;return wN+(dN/7);};
    const colorP=(p)=>p<3||p>97?'#c0392b':p<10||p>90?'#d9822b':'#1f9d55';

    const calcular=()=>{
      setErrWeeks('');setErrDays('');setErrBio('');
      if(!weeks){setErrWeeks(t('err_weeks_required'));return;}
      const w=parseInt(weeks);
      if(isNaN(w)||w<14||w>40){setErrWeeks(t('err_ga_range'));return;}
      if(days!==''){const d=parseInt(days);if(isNaN(d)||d<0||d>6){setErrDays(t('err_days_range'));return;}}
      const bN=parseFloat(bpd),hN=parseFloat(hc),aN=parseFloat(ac),fN=parseFloat(fl);
      if(isNaN(bN)&&isNaN(hN)&&isNaN(aN)&&isNaN(fN)){setErrBio(t('biom_err_required'));return;}
      const ga=toDecimal(weeks,days);
      setRes({
        ga,weeks:w,days:parseInt(days)||0,
        bpd:!isNaN(bN)?{mm:bN,p:calcBiomPerc(bN,ga,'BPD')}:null,
        hc: !isNaN(hN)?{mm:hN,p:calcBiomPerc(hN,ga,'HC')} :null,
        ac: !isNaN(aN)?{mm:aN,p:calcBiomPerc(aN,ga,'AC')} :null,
        fl: !isNaN(fN)?{mm:fN,p:calcBiomPerc(fN,ga,'FL')} :null,
      });
    };

    const BiomRow=({label,val})=>{
      if(!val) return null;
      return e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #dce7ed'}},
        e('div',null,
          e('div',{style:{fontSize:11,fontWeight:700,color:'#3b6f8a',textTransform:'uppercase',letterSpacing:'0.4px'}},label),
          e('div',{style:{fontSize:14,fontWeight:600,color:'#0f3b4f'}},val.mm,' mm')
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontSize:28,fontWeight:800,color:colorP(val.p)}},val.p.toFixed(1),'%'),
          e('div',{style:{fontSize:10,color:'#6f9bb0'}},'Percentil OMS')
        )
      );
    };

    return e('div',{className:'card'},
      e('div',{className:'card-title'},
        e('div',{className:'card-title-left'},t('biom_title')),
        e('button',{className:'ref-icon-btn',onClick:()=>setShowRef(true)},'📚')
      ),
      e('div',{style:{fontSize:12,color:'#6f9bb0',marginBottom:14}},t('biom_sub')),
      e('div',{className:'eg-group',style:{marginBottom:0}},
        e('div',{className:'eg-field'},
          e('label',null,t('weeks_label')),
          e('input',{type:'number',min:14,max:40,placeholder:'ej: 32',value:weeks,className:errWeeks?'input-error':'',onChange:ev=>{setWeeks(ev.target.value);setRes(null);setErrWeeks('');}})
        ),
        e('div',{className:'eg-field'},
          e('label',null,t('days_label')),
          e('input',{type:'number',min:0,max:6,placeholder:'0-6',value:days,className:errDays?'input-error':'',onChange:ev=>{setDays(ev.target.value);setRes(null);setErrDays('');}})
        )
      ),
      (errWeeks||errDays)&&e('div',{style:{marginBottom:8}},e(FieldError,{msg:errWeeks||errDays})),
      e('div',{className:'grid-2',style:{marginTop:8}},
        e('div',null,e('label',null,t('bpd_mm'),' (mm)'),e('input',{type:'number',step:0.1,placeholder:'ej: 72',value:bpd,onChange:ev=>{setBpd(ev.target.value);setRes(null);}})),
        e('div',null,e('label',null,t('hc_mm'),' (mm)'),e('input',{type:'number',step:0.1,placeholder:'ej: 264',value:hc,onChange:ev=>{setHc(ev.target.value);setRes(null);}})),
        e('div',null,e('label',null,t('ac_mm'),' (mm)'),e('input',{type:'number',step:0.1,placeholder:'ej: 240',value:ac,onChange:ev=>{setAc(ev.target.value);setRes(null);}})),
        e('div',null,e('label',null,t('fl_mm'),' (mm)'),e('input',{type:'number',step:0.1,placeholder:'ej: 52',value:fl,onChange:ev=>{setFl(ev.target.value);setRes(null);}}))
      ),
      e(FieldError,{msg:errBio}),
      e('button',{className:'btn',style:{marginTop:8},onClick:calcular},t('biom_calc_btn')),
      res&&e('div',{className:'result-box',style:{marginTop:16,padding:'4px 18px'}},
        e('div',{style:{fontSize:11,color:'#6f9bb0',padding:'10px 0 4px'}},'EG: ',res.weeks,'+',res.days,' sem · ',t('biom_ref_note')),
        res.bpd && e('div',null, e(BiomRow,{label:'BPD',val:res.bpd}), e(BiomChart,{dim:'BPD',mm:res.bpd.mm,ga:res.ga,pct:res.bpd.p})),
        res.hc  && e('div',null, e(BiomRow,{label:'HC', val:res.hc}),  e(BiomChart,{dim:'HC', mm:res.hc.mm, ga:res.ga||toDecimal(weeks,days),pct:res.hc.p})),
        res.ac  && e('div',null, e(BiomRow,{label:'AC', val:res.ac}),  e(BiomChart,{dim:'AC', mm:res.ac.mm, ga:res.ga||toDecimal(weeks,days),pct:res.ac.p})),
        res.fl  && e('div',null, e(BiomRow,{label:'FL', val:res.fl}),  e(BiomChart,{dim:'FL', mm:res.fl.mm, ga:res.ga||toDecimal(weeks,days),pct:res.fl.p}))
      ),
      showRef&&e(RefModal,{title:t('ref_biom_title'),text:t('ref_biom_text'),onClose:()=>setShowRef(false),closeLabel:t('close')})
    );
  };

  const PromoSection = ({t}) => e('div',{className:'promo-apps'},
    e('div',{className:'promo-title'},t('promo_title')),
    e('div',{className:'app-badge-list'},
      e('div',{className:'app-item'},t('app_semanas')),
      e('div',{className:'app-item'},t('app_ciclo'))
    ),
    e('div',{className:'promo-description'},
      e('p',{style:{marginBottom:8}},t('app_semanas'),": ",t('app_semanas_desc')),
      e('p',null,t('app_ciclo'),": ",t('app_ciclo_desc'))
    ),
    e('div',{style:{fontSize:12,marginTop:12,color:'#226f8a'}},t('available_on'))
  );

  const Disclaimer = ({t}) => e('div',{className:'disclaimer'},
    e('strong',null,t('disclaimer_title')," "),
    e('span',null,t('disclaimer_text'))
  );

  const App = () => {
    const [currentLang,setCurrentLang] = useState('es');
    const t = (key) => translations[currentLang][key]||translations.es[key]||key;
    const langList = [
      {code:'es',label:'🇪🇸 Español'},{code:'en',label:'🇬🇧 English'},{code:'pt',label:'🇵🇹 Português'},
      {code:'fr',label:'🇫🇷 Français'},{code:'de',label:'🇩🇪 Deutsch'},{code:'id',label:'🇮🇩 Indonesia'}
    ];
    return e('div',{className:'app-container'},
      e('div',{className:'lang-grid'},langList.map(l=>
        e('div',{key:l.code,className:`lang-pill ${currentLang===l.code?'active':''}`,onClick:()=>setCurrentLang(l.code)},l.label)
      )),
      e('div',{className:'brand-header'},
        e('div',{className:'logo-area'},e('span',{className:'app-name'},"FetalMetrics"),)
      ),
      e('div',{className:'subhead'},t('app_sub')),
      e(GestationalWidget,{t}),
      e(CRLWidget,{t}),
      e(FetalWidget,{t}),
      e(BiometryWidget,{t}),
      e(Disclaimer,{t}),
      e('div',{className:'footer-refs'},"© FetalMetrics · Peso: Hadlock 4 · Percentiles: OMS/Kiserud 2017 ")
    );
  };

  const rootElement = document.getElementById('root');
  if(rootElement) ReactDOM.createRoot(rootElement).render(e(App));
})();
</script>
<script>
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/fetalmetrics/sw.js')
      .then(r => console.log('SW registered'))
      .catch(e => console.log('SW error', e));
  });
}
</script>
</body>
</html>
